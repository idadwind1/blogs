const save = document.querySelector('#save');
const status = document.querySelector('#status');
const fields = ['section', 'headline', 'quote', 'date'].map(id => document.getElementById(id));
let replacement;
let uploadVersion = 0;

function wrap(value, width) {
  return value.split('\n').flatMap(paragraph => {
    const lines = [''];
    for (const word of paragraph.split(/\s+/)) {
      const last = lines.length - 1;
      const next = lines[last] ? lines[last] + ' ' + word : word;
      if (ctx.measureText(next).width <= width) {
        lines[last] = next;
        continue;
      }
      if (lines[last]) lines.push('');
      for (const character of word) {
        const index = lines.length - 1;
        if (ctx.measureText(lines[index] + character).width > width) lines.push(character);
        else lines[index] += character;
      }
    }
    return lines;
  });
}

function render() {
  if (!source.naturalWidth) return;
  const specs = [
    { font: '700 15px Arimo, Arial, sans-serif', color: '#ef321e', x: 30, top: 0, height: 26, baseline: 20, leading: 18, count: 1 },
    { font: '700 32px Arimo, Arial, sans-serif', color: '#101010', x: 30, top: 26, height: 118, baseline: 57, leading: 37, count: 3 },
    { font: 'italic 18px Arimo, Arial, sans-serif', color: '#626262', x: 32, top: 144, height: 36, baseline: 168, leading: 22, count: 1 },
    { font: '700 14px Arimo, Arial, sans-serif', color: '#101010', x: 34, top: 180, height: 37, baseline: 198, leading: 18, count: 1 }
  ];
  const rows = specs.map((spec, index) => {
    const field = fields[index];
    ctx.font = spec.font;
    const lines = field.value === field.defaultValue ? null : wrap(field.value, 668 - spec.x);
    const extra = lines ? (lines.length - spec.count) * spec.leading : 0;
    return { ...spec, lines, extra };
  });
  const shift = rows.reduce((total, row) => total + row.extra, 0);
  canvas.height = 604 + shift;
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  let offset = 0;
  for (const row of rows) {
    if (row.lines) {
      ctx.font = row.font;
      ctx.fillStyle = row.color;
      row.lines.forEach((line, index) => ctx.fillText(line, row.x, row.baseline + offset + index * row.leading));
    } else {
      ctx.drawImage(source, 0, row.top, 699, row.height, 0, row.top + offset, 699, row.height);
    }
    offset += row.extra;
  }
  ctx.drawImage(source, 0, 217, 699, 387, 0, 217 + shift, 699, 387);
  if (replacement) {
    const width = 307;
    const height = 372;
    const scale = Math.max(width / replacement.width, height / replacement.height);
    const cropWidth = width / scale;
    const cropHeight = height / scale;
    ctx.drawImage(replacement, (replacement.width - cropWidth) / 2,
      (replacement.height - cropHeight) / 2, cropWidth, cropHeight,
      360, 217 + shift, width, height);
  }
  canvas.setAttribute('aria-label', fields[1].value || 'Meme preview');
  save.disabled = false;
}

form.addEventListener('submit', event => event.preventDefault());
fields.forEach(field => field.addEventListener('input', render));
file.addEventListener('change', async () => {
  const version = ++uploadVersion;
  status.value = '';
  const imageFile = file.files[0];
  if (!imageFile) return;
  try {
    const bitmap = await createImageBitmap(imageFile);
    if (version !== uploadVersion) { bitmap.close(); return; }
    replacement?.close();
    replacement = bitmap;
    render();
  } catch {
    if (version === uploadVersion) status.value = 'Could not open that image.';
  }
});
form.addEventListener('reset', () => {
  uploadVersion++;
  replacement?.close();
  replacement = undefined;
  status.value = '';
  requestAnimationFrame(render);
});
save.addEventListener('click', () => {
  canvas.toBlob(blob => {
    if (!blob) { status.value = 'Could not export the preview.'; return; }
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'board-investigation.png';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, 'image/png');
});
source.addEventListener('load', render);
Promise.all([document.fonts.load('700 32px Arimo'),
  document.fonts.load('italic 18px Arimo')]).then(render, render);
render();
</script>
</html>
